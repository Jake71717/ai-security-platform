trust_boundaries:

  Public Internet:
    id: public-internet
    description: Untrusted network between the client and the guardrails proxy / CI runner.
    type: network-cloud-provider # values: execution-environment, network-on-premise, network-cloud-security-group, network-vpc, network-cloud-provider
    tags:
    technical_assets_inside:
      - client-application
    trust_boundaries_nested:

  Runtime Environment:
    id: runtime-environment
    description: Docker host running docker-compose.guardrails.yml (guardrails proxy + Langfuse).
    type: network-cloud-security-group # values: execution-environment, network-on-premise, network-cloud-security-group, network-vpc, network-cloud-provider
    tags:
      - docker
    technical_assets_inside:
      - guardrails-proxy
      - rag-vector-store
      - langfuse-observability
    trust_boundaries_nested:

  CI/CD Environment:
    id: cicd-environment
    description: Ephemeral GitHub Actions / Azure Pipelines execution environment holding secrets during a run.
    type: execution-environment # values: execution-environment, network-on-premise, network-cloud-security-group, network-vpc, network-cloud-provider
    tags:
      - github-actions
      - azure-pipelines
    technical_assets_inside:
