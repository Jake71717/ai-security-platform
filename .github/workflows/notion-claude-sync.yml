name: Notion → Claude knowledge query

# Manually-triggered helper: pull a Notion page as project-knowledge context
# and ask Claude a question about it. Runs scripts/notion_claude_sync.py.
#
# Required repo secrets:
#   NOTION_TOKEN        - Notion internal integration token (share the page with it)
#   ANTHROPIC_API_KEY   - Anthropic API key

on:
  workflow_dispatch:
    inputs:
      page_id:
        description: "Notion page ID to pull knowledge from"
        required: true
        type: string
      query:
        description: "Question to ask Claude"
        required: true
        default: "What are the core deliverables mentioned in our project documentation?"
        type: string
      model:
        description: "Claude model ID"
        required: false
        default: "claude-sonnet-5"
        type: string
      max_tokens:
        description: "Response token cap"
        required: false
        default: "1024"
        type: string

permissions:
  contents: read

jobs:
  query:
    name: Query Claude with Notion context
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: scripts/requirements.txt

      - name: Install dependencies
        run: pip install -r scripts/requirements.txt

      - name: Run Notion → Claude sync
        # Inputs are passed through env vars (not interpolated into the shell)
        # to avoid script injection.
        env:
          NOTION_TOKEN: ${{ secrets.NOTION_TOKEN }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          PAGE_ID: ${{ inputs.page_id }}
          QUERY: ${{ inputs.query }}
          MODEL: ${{ inputs.model }}
          MAX_TOKENS: ${{ inputs.max_tokens }}
        run: |
          python scripts/notion_claude_sync.py \
            --page-id "$PAGE_ID" \
            --query "$QUERY" \
            --model "$MODEL" \
            --max-tokens "$MAX_TOKENS" \
            | tee claude-response.txt

      - name: Upload response
        uses: actions/upload-artifact@v4
        with:
          name: claude-response
          path: claude-response.txt
